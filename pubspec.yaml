name: nshare
description: Secure, resumable LAN file transfers with a reusable Dart core.
version: 2.0.0
repository: https://github.com/cunterrainer/nshare

executables:
    nshare: nshare

environment:
    sdk: ^3.8.0

dependencies:
    args: ^2.7.0
    basic_utils: ^5.8.2
    crypto: ^3.0.3
    ffi: ^2.2.0
    path: ^1.8.3
    qr: ^3.0.2
    unorm_dart: ^0.3.3

dev_dependencies:
    lints: ^6.0.0
    test: ^1.26.0
