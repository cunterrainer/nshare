name: Distribution packages
on:
  push:
    paths: ['tool/release/**', '.github/workflows/releases.yml']
  workflow_dispatch:
    inputs:
      signed:
        description: Build platform-signed distributions using release environment secrets
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: android
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev liblzma-dev xvfb
      - name: Inno Setup compiler
        if: matrix.target == 'windows'
        shell: pwsh
        run: '"C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append'
      - name: Unsigned packages
        if: ${{ !inputs.signed || matrix.target == 'linux' }}
        run: python tool/release/package.py --target ${{ matrix.target }}
      - name: Signed packages
        if: ${{ inputs.signed && matrix.target != 'linux' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NSHARE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NSHARE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSHARE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ matrix.target == 'macos' && secrets.MACOS_CERTIFICATE_BASE64 || secrets.IOS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.target == 'macos' && secrets.MACOS_CERTIFICATE_PASSWORD || secrets.IOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python tool/release/signing_environment.py --target ${{ matrix.target }} ${{ matrix.target == 'macos' && '--notarize' || '' }}
      - name: Installed Linux package transfer smoke test
        if: matrix.target == 'linux'
        run: xvfb-run -a python tool/release/smoke-linux.py build/distributions/*/nshare.deb
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.target }}
          path: build/distributions/**
          if-no-files-found: error
