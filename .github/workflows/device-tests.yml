name: Mobile runtime transfers
on:
  workflow_dispatch:
  push:
    paths: ['lib/**', 'apps/**', '.github/workflows/device-tests.yml']
  pull_request:
    paths: ['lib/**', 'apps/**', '.github/workflows/device-tests.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: apps/nshare_app
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/nshare_app
          script: flutter test integration_test/device_transfer_test.dart -d emulator-5554 --reporter expanded
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Boot a fresh iPhone simulator with its UI
        run: |
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; version=lambda v:tuple(int(n) for n in v.split(".")[:2]); sdk=version(sys.argv[1]); rows=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-") and version(r["version"]) <= sdk]; print(max(rows,key=lambda r:version(r["version"]))["identifier"])' "$SDK_VERSION")
          echo "iOS SDK $SDK_VERSION; simulator runtime $RUNTIME_ID"
          DEVICE_ID=$(xcrun simctl create nshare-runtime com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME_ID")
          xcrun simctl boot "$DEVICE_ID"
          open -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "NSHARE_TEST_DEVICE=$DEVICE_ID" >> "$GITHUB_ENV"
      - run: flutter pub get
        working-directory: apps/nshare_app
      - name: Native iOS transfer and clipboard tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          flutter test integration_test/device_transfer_test.dart -d "$NSHARE_TEST_DEVICE" --reporter expanded --verbose 2>&1 | tee ios-runtime.log
        working-directory: apps/nshare_app
      - name: Simulator diagnostics
        if: always()
        run: |
          xcrun simctl list devices
          if [ -n "$NSHARE_TEST_DEVICE" ]; then
            xcrun simctl io "$NSHARE_TEST_DEVICE" screenshot ios-runtime.png || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-runtime-diagnostics
          path: |
            apps/nshare_app/ios-runtime.log
            ios-runtime.png
          if-no-files-found: ignore
