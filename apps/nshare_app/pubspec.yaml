name: nshare_app
description: Local encrypted file, folder and clipboard sharing.
publish_to: none
version: 3.0.0+1
environment:
  sdk: ^3.8.0
dependencies:
  flutter:
    sdk: flutter
  nshare:
    path: ../..
  path: ^1.8.3
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  flutter_foreground_task: ^9.2.0
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  launch_at_startup: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/tray.png
    - assets/tray.ico
